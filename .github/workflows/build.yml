          package com.example.nokiakeyboard

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.TextView

          class Theme(
              val name: String,
              val bg: Int,
              val key: Int,
              val text: Int,
              val border: Int,
              val accent: Int,
              val dark: Boolean
          )

          class SettingsActivity : Activity() {

              companion object {
                  const val PREFS = "nokia_prefs"
                  const val KEY_MODE = "layout_mode"
                  const val KEY_THEME = "theme_index"
                  const val KEY_LETTER = "letter_size"
                  const val MIN_LETTER = 16
                  const val MAX_LETTER = 40
                  const val DEF_LETTER = 26
                  const val KEY_KB = "kb_scale"
                  const val MIN_KB = 80
                  const val MAX_KB = 120
                  const val DEF_KB = 100
                  const val MODE_AUTO = 0
                  const val MODE_PORTRAIT = 1
                  const val MODE_LANDSCAPE = 2

                  val THEMES: List<Theme> = listOf(
                      Theme("أسود وأصفر", Color.parseColor("#000000"), Color.parseColor("#0A0A0A"), Color.parseColor("#FFFFFF"), Color.parseColor("#FFFFFF"), Color.parseColor("#FFE24A"), true),
                      Theme("أسود وأخضر", Color.parseColor("#000000"), Color.parseColor("#0A0A0A"), Color.parseColor("#FFFFFF"), Color.parseColor("#FFFFFF"), Color.parseColor("#4ADE80"), true),
                      Theme("أسود وأزرق", Color.parseColor("#000000"), Color.parseColor("#0A0A0A"), Color.parseColor("#FFFFFF"), Color.parseColor("#FFFFFF"), Color.parseColor("#4DA3FF"), true),
                      Theme("أسود وزهري", Color.parseColor("#000000"), Color.parseColor("#0A0A0A"), Color.parseColor("#FFFFFF"), Color.parseColor("#FFFFFF"), Color.parseColor("#FF6FA5"), true),
                      Theme("أسود وبرتقالي", Color.parseColor("#000000"), Color.parseColor("#0A0A0A"), Color.parseColor("#FFFFFF"), Color.parseColor("#FFFFFF"), Color.parseColor("#FF9F43"), true),
                      Theme("فاتح", Color.parseColor("#EDEFF2"), Color.parseColor("#FFFFFF"), Color.parseColor("#111111"), Color.parseColor("#8A94A6"), Color.parseColor("#1A73E8"), false),
                      Theme("نوكيا كلاسيكي", Color.parseColor("#182235"), Color.parseColor("#E2E7ED"), Color.parseColor("#1A222F"), Color.parseColor("#FFFFFF"), Color.parseColor("#1F4E9C"), false)
                  )

                  fun layoutMode(context: Context): Int =
                      context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getInt(KEY_MODE, MODE_AUTO)

                  fun themeIndex(context: Context): Int {
                      val i = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getInt(KEY_THEME, 0)
                      return if (i in THEMES.indices) i else 0
                  }

                  fun letterSize(context: Context): Int =
                      context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .getInt(KEY_LETTER, DEF_LETTER).coerceIn(MIN_LETTER, MAX_LETTER)

                  fun setLetterSize(context: Context, value: Int) {
                      context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                          .putInt(KEY_LETTER, value.coerceIn(MIN_LETTER, MAX_LETTER)).apply()
                  }

                  fun kbScale(context: Context): Int =
                      context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .getInt(KEY_KB, DEF_KB).coerceIn(MIN_KB, MAX_KB)

                  fun setKbScale(context: Context, value: Int) {
                      context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                          .putInt(KEY_KB, value.coerceIn(MIN_KB, MAX_KB)).apply()
                  }

                  fun theme(context: Context): Theme = THEMES[themeIndex(context)]

                  fun nextTheme(context: Context) {
                      val next = (themeIndex(context) + 1) % THEMES.size
                      context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putInt(KEY_THEME, next).apply()
                  }
              }

              private lateinit var themeName: TextView
              private lateinit var sizeText: TextView
              private lateinit var kbText: TextView
              private lateinit var previewBox: LinearLayout
              private lateinit var previewKey: TextView
              private lateinit var previewFn: TextView

              private fun makeButton(label: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun makeText(value: String, size: Float): TextView {
                  val t = TextView(this)
                  t.text = value
                  t.textSize = size
                  t.setTextColor(Color.WHITE)
                  return t
              }

              private fun keyBg(fill: Int, stroke: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = 12f * resources.displayMetrics.density
                  g.setStroke((2 * resources.displayMetrics.density).toInt(), stroke)
                  return g
              }

              private fun refreshPreview() {
                  val t = theme(this)
                  themeName.text = "الألوان الحالية: " + t.name
                  previewBox.setBackgroundColor(t.bg)
                  previewKey.setTextColor(t.text)
                  previewKey.background = keyBg(t.key, t.border)
                  previewFn.setTextColor(t.accent)
                  previewFn.background = keyBg(t.key, t.accent)
                  previewKey.textSize = letterSize(this).toFloat()
                  sizeText.text = "حجم الحروف: " + letterSize(this)
                  kbText.text = "حجم الكيبورد: " + kbScale(this) + "%"
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  val pad = (20 * d).toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad * 2, pad, pad)
                  root.setBackgroundColor(Color.rgb(24, 34, 53))

                  root.addView(makeText("إعدادات الكيبورد", 24f))
                  root.addView(makeText("\nشكل لوحة المفاتيح:", 18f))

                  val group = RadioGroup(this)
                  val options = listOf(
                      MODE_AUTO to "تلقائي (عمودي 3×4 / أفقي كامل)",
                      MODE_PORTRAIT to "عمودي (أزرار 3×4)",
                      MODE_LANDSCAPE to "أفقي (كيبورد كامل بحروف)"
                  )
                  val current = layoutMode(this)
                  for ((mode, label) in options) {
                      val rb = RadioButton(this)
                      rb.id = View.generateViewId()
                      rb.text = label
                      rb.textSize = 18f
                      rb.setTextColor(Color.WHITE)
                      rb.tag = mode
                      rb.isChecked = (mode == current)
                      group.addView(rb)
                  }
                  group.setOnCheckedChangeListener { g, checkedId ->
                      val rb = g.findViewById<RadioButton>(checkedId)
                      if (rb != null) {
                          val mode = rb.tag as Int
                          getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putInt(KEY_MODE, mode).apply()
                      }
                  }
                  root.addView(group)

                  root.addView(makeText("\nالألوان:", 18f))
                  themeName = makeText("", 16f)
                  root.addView(themeName)

                  previewBox = LinearLayout(this)
                  previewBox.orientation = LinearLayout.HORIZONTAL
                  previewBox.setPadding((10 * d).toInt(), (10 * d).toInt(), (10 * d).toInt(), (10 * d).toInt())
                  previewKey = TextView(this)
                  previewKey.text = "ب ت ة ث"
                  previewKey.textSize = 20f
                  previewKey.gravity = Gravity.CENTER
                  previewFn = TextView(this)
                  previewFn.text = "⌫"
                  previewFn.textSize = 24f
                  previewFn.gravity = Gravity.CENTER
                  val lp1 = LinearLayout.LayoutParams(0, (64 * d).toInt(), 2f)
                  lp1.setMargins((4 * d).toInt(), 0, (4 * d).toInt(), 0)
                  val lp2 = LinearLayout.LayoutParams(0, (64 * d).toInt(), 1f)
                  lp2.setMargins((4 * d).toInt(), 0, (4 * d).toInt(), 0)
                  previewBox.addView(previewKey, lp1)
                  previewBox.addView(previewFn, lp2)
                  root.addView(previewBox)

                  root.addView(makeButton("تغيير الألوان") {
                      nextTheme(this)
                      refreshPreview()
                  })

                  root.addView(makeText("\nحجم الحروف:", 18f))
                  sizeText = makeText("", 16f)
                  root.addView(sizeText)
                  val sizeRow = LinearLayout(this)
                  sizeRow.orientation = LinearLayout.HORIZONTAL
                  val bigger = makeButton("تكبير الحروف +") {
                      setLetterSize(this, letterSize(this) + 2)
                      refreshPreview()
                  }
                  val smaller = makeButton("تصغير الحروف −") {
                      setLetterSize(this, letterSize(this) - 2)
                      refreshPreview()
                  }
                  sizeRow.addView(bigger, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  sizeRow.addView(smaller, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(sizeRow)

                  root.addView(makeText("\nحجم الكيبورد كامل:", 18f))
                  kbText = makeText("", 16f)
                  root.addView(kbText)
                  val kbRow = LinearLayout(this)
                  kbRow.orientation = LinearLayout.HORIZONTAL
                  val kbBigger = makeButton("تكبير الكيبورد +") {
                      setKbScale(this, kbScale(this) + 10)
                      refreshPreview()
                  }
                  val kbSmaller = makeButton("تصغير الكيبورد −") {
                      setKbScale(this, kbScale(this) - 10)
                      refreshPreview()
                  }
                  kbRow.addView(kbBigger, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  kbRow.addView(kbSmaller, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(kbRow)
                  refreshPreview()

                  root.addView(makeText("\n", 12f))
                  root.addView(makeButton("1) تفعيل الكيبورد") {
                      startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS))
                  })
                  root.addView(makeButton("2) اختيار الكيبورد") {
                      val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.showInputMethodPicker()
                  })

                  root.addView(makeText("\nجرّب الكيبورد هنا:", 18f))
                  val test = EditText(this)
                  test.hint = "اكتب هنا"
                  test.setTextColor(Color.WHITE)
                  test.setHintTextColor(Color.LTGRAY)
                  root.addView(test)

                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }
          }
