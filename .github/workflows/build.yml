name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project
        run: |
          mkdir -p P
          cat > P/settings.gradle << 'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NokiaStyleKeyboard"
          include(":app")
          EOF_FILE
          cat > P/build.gradle << 'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF_FILE
          cat > P/gradle.properties << 'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p P/app
          cat > P/app/build.gradle << 'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.nokiakeyboard'
              compileSdk 35
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              defaultConfig {
                  applicationId 'com.example.nokiakeyboard'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF_FILE
          mkdir -p P/app/src/main
          cat > P/app/src/main/AndroidManifest.xml << 'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Nokia Style Keyboard"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="false">
                  <activity
                      android:name=".SettingsActivity"
                      android:label="Nokia Keyboard"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".NokiaImeService"
                      android:label="Nokia Style Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p P/app/src/main/res/xml
          cat > P/app/src/main/res/xml/method.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.example.nokiakeyboard.SettingsActivity">
              <subtype
                  android:label="العربية / English"
                  android:imeSubtypeLocale="ar"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF_FILE
          mkdir -p P/app/src/main/java/com/example/nokiakeyboard
          cat > P/app/src/main/java/com/example/nokiakeyboard/NokiaImeService.kt << 'EOF_FILE'
          package com.example.nokiakeyboard

          import android.content.Intent
          import android.inputmethodservice.InputMethodService
          import android.view.KeyEvent
          import android.view.View

          class NokiaImeService : InputMethodService() {
              private var keyboardView: NokiaKeyboardView? = null

              override fun onEvaluateFullscreenMode(): Boolean = false

              override fun onCreateInputView(): View {
                  keyboardView = NokiaKeyboardView(this) { key ->
                      val ic = currentInputConnection ?: return@NokiaKeyboardView
                      when (key) {
                          NokiaKeyboardView.ACTION_BACKSPACE -> {
                              ic.deleteSurroundingText(1, 0)
                          }
                          NokiaKeyboardView.ACTION_ENTER -> {
                              ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
                              ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                          }
                          NokiaKeyboardView.ACTION_SPACE -> ic.commitText(" ", 1)
                          NokiaKeyboardView.ACTION_LANGUAGE -> keyboardView?.toggleLanguage()
                          NokiaKeyboardView.ACTION_SHIFT -> keyboardView?.toggleShift()
                          NokiaKeyboardView.ACTION_SETTINGS -> {
                              val i = Intent(this, SettingsActivity::class.java)
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(i)
                          }
                          else -> ic.commitText(key, 1)
                      }
                  }
                  return keyboardView!!
              }

              override fun onStartInputView(info: android.view.inputmethod.EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  keyboardView?.resetShift()
                  keyboardView?.refreshLayout()
              }
          }
          EOF_FILE
          mkdir -p P/app/src/main/java/com/example/nokiakeyboard
          cat > P/app/src/main/java/com/example/nokiakeyboard/NokiaKeyboardView.kt << 'EOF_FILE'
          package com.example.nokiakeyboard

          import android.content.Context
          import android.content.res.Configuration
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.os.Handler
          import android.os.Looper
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.SoundEffectConstants
          import android.view.View

          class NokiaKeyboardView(
              context: Context,
              private val onKey: (String) -> Unit
          ) : View(context) {

              companion object {
                  const val ACTION_BACKSPACE = "__BACKSPACE__"
                  const val ACTION_ENTER = "__ENTER__"
                  const val ACTION_SPACE = "__SPACE__"
                  const val ACTION_LANGUAGE = "__LANGUAGE__"
                  const val ACTION_SHIFT = "__SHIFT__"
                  const val ACTION_SETTINGS = "__SETTINGS__"
                  const val ACTION_DIGITS = "__DIGITS__"
                  const val ACTION_LETTERS = "__LETTERS__"
                  private const val T9 = "T9:"
                  private const val MULTITAP_MS = 900L
                  private const val LONG_PRESS_MS = 450L
              }

              private val density = resources.displayMetrics.density
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val uiHandler = Handler(Looper.getMainLooper())
              private var arabic = true
              private var shifted = false
              private var pressedIndex = -1
              private var longPressed = false
              private var lastT9Digit = ' '
              private var tapCount = 0
              private var lastTapTime = 0L
              private var cycleUpper = false
              private var digitMode = false

              private data class Key(
                  val label: String,
                  val value: String,
                  val weight: Float = 1f,
                  val sub: String = ""
              )

              private val longPressRunnable = Runnable {
                  val keys = keyRects()
                  if (pressedIndex in keys.indices) {
                      val v = keys[pressedIndex].second.value
                      if (v.startsWith(T9)) {
                          longPressed = true
                          resetMultiTap()
                          performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                          onKey(v.substring(T9.length))
                      }
                  }
              }

              private fun useT9(): Boolean = when (SettingsActivity.layoutMode(context)) {
                  SettingsActivity.MODE_PORTRAIT -> true
                  SettingsActivity.MODE_LANDSCAPE -> false
                  else -> resources.configuration.orientation != Configuration.ORIENTATION_LANDSCAPE
              }

              private fun lettersFor(d: Char): String {
                  if (arabic) {
                      return when (d) {
                          '1' -> "،.؟!ءئؤ"
                          '2' -> "اأبتث"
                          '3' -> "جحخ"
                          '4' -> "دذرز"
                          '5' -> "سشصض"
                          '6' -> "طظعغ"
                          '7' -> "فقك"
                          '8' -> "لمن"
                          '9' -> "هويةى"
                          else -> ""
                      }
                  }
                  return when (d) {
                      '1' -> ".,?!'@-"
                      '2' -> "abc"
                      '3' -> "def"
                      '4' -> "ghi"
                      '5' -> "jkl"
                      '6' -> "mno"
                      '7' -> "pqrs"
                      '8' -> "tuv"
                      '9' -> "wxyz"
                      else -> ""
                  }
              }

              private fun t9Rows(): List<List<Key>> {
                  val top = listOf(
                      Key("⚙", ACTION_SETTINGS),
                      Key(if (arabic) "EN" else "ع", ACTION_LANGUAGE),
                      Key("⇧", ACTION_SHIFT),
                      Key("⌫", ACTION_BACKSPACE)
                  )
                  if (digitMode) {
                      fun n(c: Char): Key = Key(c.toString(), c.toString())
                      return listOf(
                          top,
                          listOf(n('1'), n('2'), n('3')),
                          listOf(n('4'), n('5'), n('6')),
                          listOf(n('7'), n('8'), n('9')),
                          listOf(Key(if (arabic) "أبج" else "ABC", ACTION_LETTERS), n('0'), Key("↵", ACTION_ENTER))
                      )
                  }
                  fun d(c: Char): Key = Key(lettersFor(c), T9 + c)
                  return listOf(
                      top,
                      listOf(d('1'), d('2'), d('3')),
                      listOf(d('4'), d('5'), d('6')),
                      listOf(d('7'), d('8'), d('9')),
                      listOf(
                          Key("123", ACTION_DIGITS),
                          Key("☻", "😊"),
                          Key(if (arabic) "مسافة" else "space", ACTION_SPACE, 2f),
                          Key("↵", ACTION_ENTER)
                      )
                  )
              }

              private fun qwertyRows(): List<List<Key>> {
                  val numberRow = listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0").map { Key(it, it) }
                  val letters: List<List<Key>> = if (arabic) {
                      listOf(
                          listOf("ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج").map { Key(it, it) },
                          listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك").map { Key(it, it) },
                          listOf(Key("⇧", ACTION_SHIFT, 1.35f)) +
                              listOf("ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و").map { Key(it, it) } +
                              Key("⌫", ACTION_BACKSPACE, 1.35f)
                      )
                  } else {
                      listOf(
                          listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p").map { Key(it, it) },
                          listOf("a", "s", "d", "f", "g", "h", "j", "k", "l").map { Key(it, it) },
                          listOf(Key("⇧", ACTION_SHIFT, 1.35f)) +
                              listOf("z", "x", "c", "v", "b", "n", "m").map { Key(it, it) } +
                              Key("⌫", ACTION_BACKSPACE, 1.35f)
                      )
                  }
                  return listOf(numberRow) + letters + listOf(
                      listOf(
                          Key(if (arabic) "EN" else "ع", ACTION_LANGUAGE, 1.0f),
                          Key("⚙", ACTION_SETTINGS, 0.9f),
                          Key("☻", "😊", 0.8f),
                          Key(if (arabic) "مسافة" else "space", ACTION_SPACE, 3.5f),
                          Key(if (arabic) "، ." else ", .", if (arabic) "،" else ",", 1.0f),
                          Key("↵", ACTION_ENTER, 1.0f)
                      )
                  )
              }

              private fun rows(): List<List<Key>> = if (useT9()) t9Rows() else qwertyRows()

              fun toggleLanguage() { arabic = !arabic; resetMultiTap(); invalidate() }
              fun toggleShift() { shifted = !shifted; invalidate() }
              fun resetShift() { shifted = false; digitMode = false; resetMultiTap(); invalidate() }
              fun refreshLayout() { requestLayout(); invalidate() }

              private fun resetMultiTap() {
                  lastT9Digit = ' '
                  tapCount = 0
              }

              private fun keyRects(): List<Pair<RectF, Key>> {
                  val result = mutableListOf<Pair<RectF, Key>>()
                  val allRows = rows()
                  val outer = 7f * density
                  val rowGap = 7f * density
                  val top = 9f * density
                  val bottom = 9f * density
                  val rowHeight = (height - top - bottom - rowGap * (allRows.size - 1)) / allRows.size
                  allRows.forEachIndexed { ri, row ->
                      val gap = 5f * density
                      val totalWeight = row.sumOf { it.weight.toDouble() }.toFloat()
                      val available = width - outer * 2 - gap * (row.size - 1)
                      var x = outer
                      val y = top + ri * (rowHeight + rowGap)
                      row.forEach { key ->
                          val w = available * key.weight / totalWeight
                          result.add(RectF(x, y, x + w, y + rowHeight) to key)
                          x += w + gap
                      }
                  }
                  return result
              }

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = MeasureSpec.getSize(widthMeasureSpec)
                  val desired = ((if (useT9()) 340 else 270) * density).toInt()
                  val h = resolveSize(desired, heightMeasureSpec)
                  setMeasuredDimension(w, h)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  canvas.drawColor(Color.rgb(24, 34, 53))
                  val keys = keyRects()
                  keys.forEachIndexed { index, (r, key) ->
                      val active = index == pressedIndex
                      paint.style = Paint.Style.FILL
                      paint.color = Color.rgb(7, 12, 22)
                      canvas.drawRoundRect(RectF(r.left, r.top + 2 * density, r.right, r.bottom + 2 * density), 11 * density, 11 * density, paint)

                      paint.color = if (active) Color.rgb(190, 201, 215) else Color.rgb(226, 231, 237)
                      canvas.drawRoundRect(r, 10 * density, 10 * density, paint)

                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = 1.2f * density
                      paint.color = Color.rgb(255, 255, 255)
                      canvas.drawRoundRect(
                          RectF(r.left + density, r.top + density, r.right - density, r.bottom - density),
                          9 * density, 9 * density, paint
                      )
                      paint.style = Paint.Style.FILL
                      paint.color = Color.rgb(26, 34, 47)
                      paint.typeface = Typeface.create("sans-serif", Typeface.BOLD)
                      paint.textAlign = Paint.Align.CENTER

                      if (key.sub.isNotEmpty()) {
                          paint.textSize = 30f * density
                          canvas.drawText(key.label, r.centerX(), r.centerY() - 3f * density, paint)
                          paint.textSize = 14f * density
                          val subText = if (shifted && !arabic) key.sub.uppercase() else key.sub
                          canvas.drawText(subText, r.centerX(), r.centerY() + 19f * density, paint)
                      } else {
                          val upperOk = key.value.startsWith(T9) || (key.value.length == 1 && key.value[0].isLetter())
                          val label = if (shifted && !arabic && upperOk) key.label.uppercase() else key.label
                          val size = when {
                              key.value.startsWith(T9) -> if (label.length <= 4) 30f else 26f
                              digitMode && label.length == 1 && label[0].isDigit() -> 36f
                              key.value == ACTION_SPACE -> 20f
                              label.length > 3 -> 16f
                              else -> 26f
                          } * density
                          paint.textSize = size
                          if (key.value.startsWith(T9)) {
                              val chars = label.toCharArray().map { it.toString() }
                              val half = (chars.size + 1) / 2
                              val lines = if (chars.size > 4) listOf(chars.take(half), chars.drop(half)) else listOf(chars)
                              val lineHeight = paint.fontSpacing
                              var y = r.centerY() - lineHeight * lines.size / 2 - paint.ascent()
                              for (ln in lines) {
                                  canvas.drawText(ln.joinToString(" "), r.centerX(), y, paint)
                                  y += lineHeight
                              }
                          } else {
                              val baseline = r.centerY() - (paint.ascent() + paint.descent()) / 2
                              canvas.drawText(label, r.centerX(), baseline, paint)
                          }
                      }
                  }
              }

              private fun feedback() {
                  playSoundEffect(SoundEffectConstants.CLICK)
                  performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
              }

              private fun handleT9(d: Char) {
                  if (d == '0') {
                      resetMultiTap()
                      onKey(ACTION_SPACE)
                      return
                  }
                  val letters = lettersFor(d)
                  if (letters.isEmpty()) return
                  val now = System.currentTimeMillis()
                  val continuing = d == lastT9Digit && now - lastTapTime < MULTITAP_MS
                  if (continuing) {
                      tapCount = (tapCount + 1) % letters.length
                      onKey(ACTION_BACKSPACE)
                  } else {
                      tapCount = 0
                      cycleUpper = shifted && !arabic
                      if (shifted && !arabic) shifted = false
                  }
                  val ch = letters[tapCount].toString()
                  onKey(if (cycleUpper) ch.uppercase() else ch)
                  lastT9Digit = d
                  lastTapTime = now
              }

              private fun handleKey(key: Key) {
                  val v = key.value
                  if (v.startsWith(T9)) {
                      handleT9(v[T9.length])
                      return
                  }
                  resetMultiTap()
                  if (v == ACTION_DIGITS) {
                      digitMode = true
                      invalidate()
                      return
                  }
                  if (v == ACTION_LETTERS) {
                      digitMode = false
                      invalidate()
                      return
                  }
                  when (v) {
                      ACTION_SHIFT, ACTION_LANGUAGE, ACTION_BACKSPACE, ACTION_ENTER, ACTION_SPACE, ACTION_SETTINGS -> onKey(v)
                      else -> {
                          val upper = shifted && !arabic && v.length == 1 && v[0].isLetter()
                          onKey(if (upper) v.uppercase() else v)
                          if (upper) shifted = false
                      }
                  }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  val keys = keyRects()
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          uiHandler.removeCallbacks(longPressRunnable)
                          longPressed = false
                          pressedIndex = keys.indexOfFirst { it.first.contains(event.x, event.y) }
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_UP -> {
                          uiHandler.removeCallbacks(longPressRunnable)
                          val index = keys.indexOfFirst { it.first.contains(event.x, event.y) }
                          if (index >= 0 && index == pressedIndex && !longPressed) {
                              feedback()
                              handleKey(keys[index].second)
                          }
                          pressedIndex = -1
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          uiHandler.removeCallbacks(longPressRunnable)
                          pressedIndex = -1
                          invalidate()
                          return true
                      }
                  }
                  return true
              }
          }
          EOF_FILE
          mkdir -p P/app/src/main/java/com/example/nokiakeyboard
          cat > P/app/src/main/java/com/example/nokiakeyboard/SettingsActivity.kt << 'EOF_FILE'
          package com.example.nokiakeyboard

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.TextView

          class SettingsActivity : Activity() {

              companion object {
                  const val PREFS = "nokia_prefs"
                  const val KEY_MODE = "layout_mode"
                  const val MODE_AUTO = 0
                  const val MODE_PORTRAIT = 1
                  const val MODE_LANDSCAPE = 2

                  fun layoutMode(context: Context): Int =
                      context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getInt(KEY_MODE, MODE_AUTO)
              }

              private fun makeButton(label: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun makeText(value: String, size: Float): TextView {
                  val t = TextView(this)
                  t.text = value
                  t.textSize = size
                  t.setTextColor(Color.WHITE)
                  return t
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  val pad = (20 * d).toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad * 2, pad, pad)
                  root.setBackgroundColor(Color.rgb(24, 34, 53))

                  root.addView(makeText("إعدادات الكيبورد", 24f))
                  root.addView(makeText("\nشكل لوحة المفاتيح:", 18f))

                  val group = RadioGroup(this)
                  val options = listOf(
                      MODE_AUTO to "تلقائي (عمودي T9 / أفقي كامل)",
                      MODE_PORTRAIT to "عمودي (أزرار نوكيا بأرقام T9)",
                      MODE_LANDSCAPE to "أفقي (كيبورد كامل بحروف)"
                  )
                  val current = layoutMode(this)
                  for ((mode, label) in options) {
                      val rb = RadioButton(this)
                      rb.id = View.generateViewId()
                      rb.text = label
                      rb.textSize = 18f
                      rb.setTextColor(Color.WHITE)
                      rb.tag = mode
                      rb.isChecked = (mode == current)
                      group.addView(rb)
                  }
                  group.setOnCheckedChangeListener { g, checkedId ->
                      val rb = g.findViewById<RadioButton>(checkedId)
                      if (rb != null) {
                          val mode = rb.tag as Int
                          getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putInt(KEY_MODE, mode).apply()
                      }
                  }
                  root.addView(group)

                  root.addView(makeText("\n", 12f))
                  root.addView(makeButton("1) تفعيل الكيبورد") {
                      startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS))
                  })
                  root.addView(makeButton("2) اختيار الكيبورد") {
                      val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.showInputMethodPicker()
                  })

                  root.addView(makeText("\nجرّب الكيبورد هنا:", 18f))
                  val test = EditText(this)
                  test.hint = "اكتب هنا"
                  test.setTextColor(Color.WHITE)
                  test.setHintTextColor(Color.LTGRAY)
                  root.addView(test)

                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }
          }
          EOF_FILE
      - name: Build
        run: cd P && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NokiaKeyboard-apk
          path: P/app/build/outputs/apk/debug/*.apk
