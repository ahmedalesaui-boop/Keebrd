          package com.example.nokiakeyboard

          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.widget.Toast

          object VoiceBridge {
              var listener: ((String) -> Unit)? = null
          }

          class VoiceActivity : Activity() {

              private val requestCodeVoice = 77

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (savedInstanceState != null) return
                  val lang = intent.getStringExtra("lang") ?: "ar-SA"
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang)
                  i.putExtra(RecognizerIntent.EXTRA_PROMPT, "تحدّث الآن")
                  try {
                      startActivityForResult(i, requestCodeVoice)
                  } catch (e: ActivityNotFoundException) {
                      Toast.makeText(this, "التعرف على الصوت غير متاح على هذا الجهاز", Toast.LENGTH_LONG).show()
                      finish()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == requestCodeVoice && resultCode == RESULT_OK) {
                      val list = data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)
                      val text = list?.firstOrNull()
                      if (!text.isNullOrEmpty()) {
                          VoiceBridge.listener?.invoke(text)
                      }
                  }
                  finish()
              }
          }
