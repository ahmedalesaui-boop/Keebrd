name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project
        run: |
          mkdir -p P
          cat > P/settings.gradle << 'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NokiaStyleKeyboard"
          include(":app")
          EOF_FILE
          cat > P/build.gradle << 'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF_FILE
          cat > P/gradle.properties << 'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p P/app
          cat > P/app/build.gradle << 'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.nokiakeyboard'
              compileSdk 35
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              defaultConfig {
                  applicationId 'com.example.nokiakeyboard'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF_FILE
          mkdir -p P/app/src/main
          cat > P/app/src/main/AndroidManifest.xml << 'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Nokia Style Keyboard"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="false">
                  <activity
                      android:name=".SettingsActivity"
                      android:label="Nokia Keyboard"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".VoiceActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />
                  <service
                      android:name=".NokiaImeService"
                      android:label="Nokia Style Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p P/app/src/main/res/xml
          cat > P/app/src/main/res/xml/method.xml << 'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.example.nokiakeyboard.SettingsActivity">
              <subtype
                  android:label="العربية / English"
                  android:imeSubtypeLocale="ar"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF_FILE
          mkdir -p P/app/src/main/java/com/example/nokiakeyboard
          cat > P/app/src/main/java/com/example/nokiakeyboard/NokiaImeService.kt << 'EOF_FILE'
          package com.example.nokiakeyboard

          import android.content.Intent
          import android.inputmethodservice.InputMethodService
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          import android.view.View

          class NokiaImeService : InputMethodService() {
              private var keyboardView: NokiaKeyboardView? = null

              override fun onEvaluateFullscreenMode(): Boolean = false

              override fun onCreateInputView(): View {
                  keyboardView = NokiaKeyboardView(this) { key ->
                      val ic = currentInputConnection ?: return@NokiaKeyboardView
                      when (key) {
                          NokiaKeyboardView.ACTION_BACKSPACE -> {
                              val before = ic.getTextBeforeCursor(2, 0)
                              if (before != null && before.length == 2 && Character.isSurrogatePair(before[0], before[1])) {
                                  ic.deleteSurroundingText(2, 0)
                              } else {
                                  ic.deleteSurroundingText(1, 0)
                              }
                          }
                          NokiaKeyboardView.ACTION_ENTER -> {
                              ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
                              ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                          }
                          NokiaKeyboardView.ACTION_SPACE -> ic.commitText(" ", 1)
                          NokiaKeyboardView.ACTION_LANGUAGE -> keyboardView?.toggleLanguage()
                          NokiaKeyboardView.ACTION_SHIFT -> keyboardView?.toggleShift()
                          NokiaKeyboardView.ACTION_MIC -> {
                              VoiceBridge.listener = { text ->
                                  Handler(Looper.getMainLooper()).postDelayed({
                                      currentInputConnection?.commitText(text, 1)
                                  }, 400)
                              }
                              val vi = Intent(this, VoiceActivity::class.java)
                              vi.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              vi.putExtra("lang", if (keyboardView?.isArabic() == true) "ar-SA" else "en-US")
                              startActivity(vi)
                          }
                          NokiaKeyboardView.ACTION_SETTINGS -> {
                              val i = Intent(this, SettingsActivity::class.java)
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(i)
                          }
                          else -> ic.commitText(key, 1)
                      }
                  }
                  return keyboardView!!
              }

              override fun onStartInputView(info: android.view.inputmethod.EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  keyboardView?.resetShift()
                  keyboardView?.refreshLayout()
              }
          }
          EOF_FILE
          mkdir -p P/app/src/main/java/com/example/nokiakeyboard
          cat > P/app/src/main/java/com/example/nokiakeyboard/NokiaKeyboardView.kt << 'EOF_FILE'
          package com.example.nokiakeyboard

          import android.content.ClipboardManager
          import android.content.Context
          import android.content.res.Configuration
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.SoundEffectConstants
          import android.view.View

          class NokiaKeyboardView(
              context: Context,
              private val onKey: (String) -> Unit
          ) : View(context) {

              companion object {
                  const val ACTION_BACKSPACE = "__BACKSPACE__"
                  const val ACTION_ENTER = "__ENTER__"
                  const val ACTION_SPACE = "__SPACE__"
                  const val ACTION_LANGUAGE = "__LANGUAGE__"
                  const val ACTION_SHIFT = "__SHIFT__"
                  const val ACTION_SETTINGS = "__SETTINGS__"
                  const val ACTION_MIC = "__MIC__"
                  private const val ACTION_SYMBOLS = "__SYMBOLS__"
                  private const val ACTION_LETTERS = "__LETTERS__"
                  private const val ACTION_THEME = "__THEME__"
                  private const val ACTION_PASTE = "__PASTE__"
                  private const val ACTION_NOOP = "__NOOP__"
                  private const val ACTION_EMOJI = "__EMOJI__"
                  private const val ACTION_SPECIAL = "__SPECIAL__"
                  private const val ACTION_SP_PREV = "__SP_PREV__"
                  private const val ACTION_SP_NEXT = "__SP_NEXT__"
                  private const val ACTION_EMO_PREV = "__EMO_PREV__"
                  private const val ACTION_EMO_NEXT = "__EMO_NEXT__"
                  private const val T9 = "T9:"
                  private const val MULTITAP_MS = 900L
              }

              private val density = resources.displayMetrics.density
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var arabic = true
              private var shifted = false
              private var symbols = false
              private var emoji = false
              private var special = false
              private var specialPage = 0
              private var emojiPage = 0
              private var pressedIndex = -1
              private var lastT9Digit = ' '
              private var tapCount = 0
              private var lastTapTime = 0L
              private var cycleUpper = false

              // kind: 0 = normal key, 1 = function key (accent colour), 2 = flat toolbar icon
              private val emojiPages: List<List<String>> = listOf(
                  listOf("😀", "😁", "😂", "😅", "😊", "😍", "😘", "😎", "😜", "😢", "😭", "😡"),
                  listOf("😴", "😱", "🤔", "🙄", "😏", "😉", "🥰", "🤩", "😇", "🤗", "😋", "🤭"),
                  listOf("👍", "👎", "👏", "🙏", "💪", "👌", "🙌", "👋", "💖", "💙", "💚", "💛"),
                  listOf("🔥", "🎉", "💯", "🌹", "🌙", "🌞", "🌟", "🎂", "🎁", "🍕", "🚗", "📱")
              )

              // Special-letters panel (two pages of extra Arabic letters)
              private val specialPages: List<List<String>> = listOf(
                  listOf("أ", "إ", "آ", "ء", "ؤ", "ئ", "ى", "ة", "پ", "چ", "ڤ", "گ"),
                  listOf("ژ", "ڭ", "ڨ", "ۆ", "ێ", "ە", "ڕ", "ڵ", "ی", "ک", "ھ", "ٹ")
              )

              private data class Key(
                  val label: String,
                  val value: String,
                  val weight: Float = 1f,
                  val corner: String = "",
                  val kind: Int = 0
              )

              private class Row(val keys: List<Key>, val h: Float = 1f)

              private fun useT9(): Boolean = when (SettingsActivity.layoutMode(context)) {
                  SettingsActivity.MODE_PORTRAIT -> true
                  SettingsActivity.MODE_LANDSCAPE -> false
                  else -> resources.configuration.orientation != Configuration.ORIENTATION_LANDSCAPE
              }

              private fun digitLabel(d: Char): String =
                  if (arabic) ('\u0660' + (d - '0')).toString() else d.toString()

              private fun lettersFor(d: Char): String {
                  if (arabic) {
                      return when (d) {
                          '1' -> "!؟،.:@-'"
                          '2' -> "بتةث"
                          '3' -> "اءأإآ"
                          '4' -> "سشصض"
                          '5' -> "دذرز"
                          '6' -> "جحخ"
                          '7' -> "نهويىؤئ"
                          '8' -> "فقكلم"
                          '9' -> "طظعغ"
                          else -> ""
                      }
                  }
                  return when (d) {
                      '1' -> ".,?!'@-:"
                      '2' -> "abc"
                      '3' -> "def"
                      '4' -> "ghi"
                      '5' -> "jkl"
                      '6' -> "mno"
                      '7' -> "pqrs"
                      '8' -> "tuv"
                      '9' -> "wxyz"
                      else -> ""
                  }
              }

              private fun displayFor(d: Char): String {
                  if (arabic) {
                      return when (d) {
                          '1' -> "!؟،."
                          '3' -> "اء"
                          '7' -> "نهوي"
                          else -> lettersFor(d)
                      }
                  }
                  return if (d == '1') ".,?!" else lettersFor(d)
              }

              private fun toolbar(): Row = Row(
                  listOf(
                      Key("⚙", ACTION_SETTINGS, kind = 2),
                      Key("🎤", ACTION_MIC, kind = 2),
                      Key("◐", ACTION_THEME, kind = 2),
                      Key("📋", ACTION_PASTE, kind = 2),
                      Key("أڤ", ACTION_SPECIAL, kind = 2),
                      Key("😊", ACTION_EMOJI, kind = 2)
                  ),
                  0.55f
              )

              private fun t9Rows(): List<Row> {
                  if (symbols) {
                      fun n(c: Char): Key = Key(c.toString(), c.toString())
                      return listOf(
                          toolbar(),
                          Row(listOf(n('1'), n('2'), n('3'), Key("⌫", ACTION_BACKSPACE, kind = 1))),
                          Row(listOf(n('4'), n('5'), n('6'), Key("↵", ACTION_ENTER, kind = 1))),
                          Row(listOf(n('7'), n('8'), n('9'), Key(".", ".", kind = 1))),
                          Row(
                              listOf(
                                  Key(if (arabic) "أبج" else "ABC", ACTION_LETTERS, kind = 1),
                                  n('0'),
                                  Key(if (arabic) "مسافة" else "space", ACTION_SPACE),
                                  Key(",", ",", kind = 1)
                              )
                          )
                      )
                  }
                  fun d(c: Char): Key = Key(displayFor(c), T9 + c, 1f, digitLabel(c))
                  return listOf(
                      toolbar(),
                      Row(listOf(d('1'), d('2'), d('3'), Key("⌫", ACTION_BACKSPACE, kind = 1))),
                      Row(listOf(d('4'), d('5'), d('6'), Key("↵", ACTION_ENTER, kind = 1))),
                      Row(listOf(d('7'), d('8'), d('9'), Key("⇧", ACTION_SHIFT, kind = 1))),
                      Row(
                          listOf(
                              Key("!#1", ACTION_SYMBOLS, kind = 1),
                              Key(if (arabic) "AR" else "EN", ACTION_LANGUAGE, kind = 1),
                              Key("", ACTION_SPACE, 1f, digitLabel('0')),
                              Key(".", ".", kind = 1)
                          )
                      )
                  )
              }

              private fun qwertyRows(): List<Row> {
                  val numberRow = listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0").map { Key(it, it) }
                  val letters: List<List<Key>> = if (arabic) {
                      listOf(
                          listOf("ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج").map { Key(it, it) },
                          listOf("ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك").map { Key(it, it) },
                          listOf(Key("⇧", ACTION_SHIFT, 1.35f, kind = 1)) +
                              listOf("ئ", "ء", "ؤ", "ر", "ى", "ة", "و").map { Key(it, it) } +
                              Key("⌫", ACTION_BACKSPACE, 1.35f, kind = 1)
                      )
                  } else {
                      listOf(
                          listOf("q", "w", "e", "r", "t", "y", "u", "i", "o", "p").map { Key(it, it) },
                          listOf("a", "s", "d", "f", "g", "h", "j", "k", "l").map { Key(it, it) },
                          listOf(Key("⇧", ACTION_SHIFT, 1.35f, kind = 1)) +
                              listOf("z", "x", "c", "v", "b", "n", "m").map { Key(it, it) } +
                              Key("⌫", ACTION_BACKSPACE, 1.35f, kind = 1)
                      )
                  }
                  val bottom = listOf(
                      Key(if (arabic) "EN" else "ع", ACTION_LANGUAGE, 1.0f, kind = 1),
                      Key("⚙", ACTION_SETTINGS, 0.8f, kind = 1),
                      Key("◐", ACTION_THEME, 0.8f, kind = 1),
                      Key("🎤", ACTION_MIC, 0.8f, kind = 1),
                      Key("أڤ", ACTION_SPECIAL, 0.8f, kind = 1),
                      Key("☻", ACTION_EMOJI, 0.8f),
                      Key(if (arabic) "مسافة" else "space", ACTION_SPACE, 1.5f),
                      Key(if (arabic) "،" else ",", if (arabic) "،" else ",", 0.8f),
                      Key("↵", ACTION_ENTER, 1.0f, kind = 1)
                  )
                  return (listOf(numberRow) + letters + listOf(bottom)).map { Row(it) }
              }

              private fun emojiRows(): List<Row> {
                  val page = emojiPages[emojiPage]
                  fun e(i: Int): Key = Key(page[i], page[i])
                  return listOf(
                      toolbar(),
                      Row(listOf(e(0), e(1), e(2), e(3))),
                      Row(listOf(e(4), e(5), e(6), e(7))),
                      Row(listOf(e(8), e(9), e(10), e(11))),
                      Row(
                          listOf(
                              Key(if (arabic) "أبج" else "ABC", ACTION_LETTERS, kind = 1),
                              Key("◄", ACTION_EMO_PREV, kind = 1),
                              Key("►", ACTION_EMO_NEXT, kind = 1),
                              Key("⌫", ACTION_BACKSPACE, kind = 1)
                          )
                      )
                  )
              }

              private fun specialRows(): List<Row> {
                  val page = specialPages[specialPage]
                  fun k(i: Int): Key = Key(page[i], page[i])
                  return listOf(
                      toolbar(),
                      Row(listOf(k(0), k(1), k(2), k(3))),
                      Row(listOf(k(4), k(5), k(6), k(7))),
                      Row(listOf(k(8), k(9), k(10), k(11))),
                      Row(
                          listOf(
                              Key(if (arabic) "أبج" else "ABC", ACTION_LETTERS, 1f, kind = 1),
                              Key("◄", ACTION_SP_PREV, 0.8f, kind = 1),
                              Key("►", ACTION_SP_NEXT, 0.8f, kind = 1),
                              Key(if (arabic) "مسافة" else "space", ACTION_SPACE, 1.6f),
                              Key("⌫", ACTION_BACKSPACE, 1f, kind = 1)
                          )
                      )
                  )
              }

              private fun rows(): List<Row> = if (special) specialRows() else if (emoji) emojiRows() else if (useT9()) t9Rows() else qwertyRows()

              fun toggleLanguage() { arabic = !arabic; resetMultiTap(); invalidate() }
              fun toggleShift() { shifted = !shifted; invalidate() }
              fun resetShift() { shifted = false; symbols = false; emoji = false; special = false; resetMultiTap(); invalidate() }
              fun refreshLayout() { requestLayout(); invalidate() }
              fun isArabic(): Boolean = arabic

              private fun resetMultiTap() {
                  lastT9Digit = ' '
                  tapCount = 0
              }

              private fun keyRects(): List<Pair<RectF, Key>> {
                  val result = mutableListOf<Pair<RectF, Key>>()
                  val allRows = rows()
                  val outer = 10f * density
                  val gap = 7f * density
                  val top = 6f * density
                  val bottom = 10f * density
                  val totalH = allRows.sumOf { it.h.toDouble() }.toFloat()
                  val avail = height - top - bottom - gap * (allRows.size - 1)
                  var y = top
                  allRows.forEach { row ->
                      val rh = avail * row.h / totalH
                      val totalW = row.keys.sumOf { it.weight.toDouble() }.toFloat()
                      val availW = width - outer * 2 - gap * (row.keys.size - 1)
                      var x = outer
                      row.keys.forEach { key ->
                          val w = availW * key.weight / totalW
                          result.add(RectF(x, y, x + w, y + rh) to key)
                          x += w + gap
                      }
                      y += rh + gap
                  }
                  return result
              }

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = MeasureSpec.getSize(widthMeasureSpec)
                  val baseDp = if (useT9()) 380 else 290
                  val desired = (baseDp * SettingsActivity.kbScale(context) / 100f * density).toInt()
                  val h = resolveSize(desired, heightMeasureSpec)
                  setMeasuredDimension(w, h)
              }

              private fun mix(a: Int, b: Int, t: Float): Int = Color.rgb(
                  (Color.red(a) + (Color.red(b) - Color.red(a)) * t).toInt(),
                  (Color.green(a) + (Color.green(b) - Color.green(a)) * t).toInt(),
                  (Color.blue(a) + (Color.blue(b) - Color.blue(a)) * t).toInt()
              )

              private fun fitSize(lines: List<String>, maxW: Float, maxH: Float, start: Float): Float {
                  var size = start
                  paint.textSize = size
                  while (size > 10f * density &&
                      (lines.any { paint.measureText(it) > maxW } || paint.fontSpacing * lines.size > maxH)
                  ) {
                      size -= density
                      paint.textSize = size
                  }
                  return size
              }

              private fun drawLetters(canvas: Canvas, r: RectF, letters: String) {
                  val upper = if (shifted && !arabic) letters.uppercase() else letters
                  val chars = upper.toCharArray().map { it.toString() }
                  val one = chars.joinToString(" ")
                  val maxW = r.width() - 8f * density
                  val maxH = r.height() - 6f * density
                  val base = SettingsActivity.letterSize(context) * density
                  paint.textSize = base
                  var lines = listOf(one)
                  if (base > 26f * density && chars.size > 2 && paint.measureText(one) > maxW) {
                      val half = (chars.size + 1) / 2
                      lines = listOf(chars.take(half).joinToString(" "), chars.drop(half).joinToString(" "))
                  }
                  paint.textSize = fitSize(lines, maxW, maxH, base)
                  if (lines.size == 1) {
                      val baseline = r.centerY() - (paint.ascent() + paint.descent()) / 2
                      canvas.drawText(lines[0], r.centerX(), baseline, paint)
                  } else {
                      val lh = paint.fontSpacing
                      var y = r.centerY() - lh * lines.size / 2 - paint.ascent()
                      for (ln in lines) {
                          canvas.drawText(ln, r.centerX(), y, paint)
                          y += lh
                      }
                  }
              }

              private fun drawLanguageKey(canvas: Canvas, r: RectF, code: String, accent: Int) {
                  paint.color = accent
                  paint.style = Paint.Style.FILL
                  paint.textAlign = Paint.Align.CENTER
                  paint.textSize = 15f * density
                  val ty = r.top + r.height() * 0.36f
                  canvas.drawText(code, r.centerX(), ty + 5f * density, paint)
                  val s = 5f * density
                  val m = 10f * density
                  val left = Path()
                  left.moveTo(r.left + m + s, ty - s)
                  left.lineTo(r.left + m, ty)
                  left.lineTo(r.left + m + s, ty + s)
                  left.close()
                  canvas.drawPath(left, paint)
                  val right = Path()
                  right.moveTo(r.right - m - s, ty - s)
                  right.lineTo(r.right - m, ty)
                  right.lineTo(r.right - m - s, ty + s)
                  right.close()
                  canvas.drawPath(right, paint)
                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = 1.8f * density
                  val by = r.top + r.height() * 0.70f
                  val bw = r.width() * 0.26f
                  val bh = 7f * density
                  val u = Path()
                  u.moveTo(r.centerX() - bw, by - bh)
                  u.lineTo(r.centerX() - bw, by)
                  u.lineTo(r.centerX() + bw, by)
                  u.lineTo(r.centerX() + bw, by - bh)
                  canvas.drawPath(u, paint)
                  paint.style = Paint.Style.FILL
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val th = SettingsActivity.theme(context)
                  canvas.drawColor(th.bg)
                  val t9 = useT9()
                  val tint = if (th.dark) Color.WHITE else Color.BLACK
                  val keyScale = minOf(SettingsActivity.letterSize(context) / 26f, 1.3f)
                  val keys = keyRects()
                  keys.forEachIndexed { index, (r, key) ->
                      if (key.value == ACTION_NOOP) return@forEachIndexed
                      val active = index == pressedIndex
                      val fn = key.kind == 1
                      val radius = 9f * density
                      val fg = if (fn) th.accent else th.text
                      if (key.kind != 2) {
                          paint.style = Paint.Style.FILL
                          paint.color = if (active) mix(th.key, tint, 0.25f) else th.key
                          canvas.drawRoundRect(r, radius, radius, paint)
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = 1.6f * density
                          paint.color = if (fn) th.accent else th.border
                          canvas.drawRoundRect(
                              RectF(r.left + density, r.top + density, r.right - density, r.bottom - density),
                              radius, radius, paint
                          )
                      } else if (active) {
                          paint.style = Paint.Style.FILL
                          paint.color = mix(th.bg, tint, 0.25f)
                          canvas.drawRoundRect(r, radius, radius, paint)
                      }
                      paint.style = Paint.Style.FILL
                      paint.typeface = Typeface.DEFAULT
                      paint.textAlign = Paint.Align.CENTER
                      paint.color = fg

                      if (key.corner.isNotEmpty()) {
                          paint.textAlign = Paint.Align.RIGHT
                          paint.textSize = 11f * density
                          paint.color = Color.argb(200, Color.red(th.text), Color.green(th.text), Color.blue(th.text))
                          canvas.drawText(key.corner, r.right - 9f * density, r.top + 14f * density, paint)
                          paint.textAlign = Paint.Align.CENTER
                          paint.color = fg
                      }

                      if (t9 && key.value == ACTION_LANGUAGE) {
                          drawLanguageKey(canvas, r, key.label, th.accent)
                          return@forEachIndexed
                      }
                      if (key.value.startsWith(T9)) {
                          drawLetters(canvas, r, key.label)
                          return@forEachIndexed
                      }
                      if (key.label.isEmpty()) return@forEachIndexed

                      val label = if (shifted && !arabic && key.value.length == 1 && key.value[0].isLetter()) key.label.uppercase() else key.label
                      val size = when {
                          special && key.kind == 0 -> 34f
                          emoji && key.kind == 0 -> 30f
                          key.value == ACTION_SPACE -> 18f
                          label.length > 3 -> 16f
                          fn -> 26f
                          else -> 24f * keyScale
                      }
                      paint.textSize = size * density
                      val baseline = r.centerY() - (paint.ascent() + paint.descent()) / 2
                      canvas.drawText(label, r.centerX(), baseline, paint)
                  }
              }

              private fun feedback() {
                  playSoundEffect(SoundEffectConstants.CLICK)
                  performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
              }

              private fun paste() {
                  val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = cm.primaryClip
                  if (clip != null && clip.itemCount > 0) {
                      val text = clip.getItemAt(0).coerceToText(context).toString()
                      if (text.isNotEmpty()) onKey(text)
                  }
              }

              private fun handleT9(d: Char) {
                  val letters = lettersFor(d)
                  if (letters.isEmpty()) return
                  val now = System.currentTimeMillis()
                  val continuing = d == lastT9Digit && now - lastTapTime < MULTITAP_MS
                  if (continuing) {
                      tapCount = (tapCount + 1) % letters.length
                      onKey(ACTION_BACKSPACE)
                  } else {
                      tapCount = 0
                      cycleUpper = shifted && !arabic
                      if (shifted && !arabic) shifted = false
                  }
                  val ch = letters[tapCount].toString()
                  onKey(if (cycleUpper) ch.uppercase() else ch)
                  lastT9Digit = d
                  lastTapTime = now
              }

              private fun handleKey(key: Key) {
                  val v = key.value
                  if (v == ACTION_NOOP) return
                  if (v.startsWith(T9)) {
                      handleT9(v[T9.length])
                      return
                  }
                  resetMultiTap()
                  when (v) {
                      ACTION_SYMBOLS -> {
                          symbols = true
                          invalidate()
                      }
                      ACTION_LETTERS -> {
                          symbols = false
                          emoji = false
                          special = false
                          invalidate()
                      }
                      ACTION_EMOJI -> {
                          emoji = !emoji
                          special = false
                          emojiPage = 0
                          invalidate()
                      }
                      ACTION_SPECIAL -> {
                          special = !special
                          emoji = false
                          specialPage = 0
                          invalidate()
                      }
                      ACTION_SP_PREV -> {
                          specialPage = (specialPage + specialPages.size - 1) % specialPages.size
                          invalidate()
                      }
                      ACTION_SP_NEXT -> {
                          specialPage = (specialPage + 1) % specialPages.size
                          invalidate()
                      }
                      ACTION_EMO_PREV -> {
                          emojiPage = (emojiPage + emojiPages.size - 1) % emojiPages.size
                          invalidate()
                      }
                      ACTION_EMO_NEXT -> {
                          emojiPage = (emojiPage + 1) % emojiPages.size
                          invalidate()
                      }
                      ACTION_THEME -> {
                          SettingsActivity.nextTheme(context)
                          invalidate()
                      }
                      ACTION_PASTE -> paste()
                      ACTION_SHIFT, ACTION_LANGUAGE, ACTION_BACKSPACE, ACTION_ENTER, ACTION_SPACE, ACTION_SETTINGS, ACTION_MIC -> onKey(v)
                      else -> {
                          val upper = shifted && !arabic && v.length == 1 && v[0].isLetter()
                          onKey(if (upper) v.uppercase() else v)
                          if (upper) shifted = false
                      }
                  }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  val keys = keyRects()
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> {
                          pressedIndex = keys.indexOfFirst { it.first.contains(event.x, event.y) }
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_UP -> {
                          val index = keys.indexOfFirst { it.first.contains(event.x, event.y) }
                          if (index >= 0 && index == pressedIndex) {
                              feedback()
                              handleKey(keys[index].second)
                          }
                          pressedIndex = -1
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          pressedIndex = -1
                          invalidate()
                          return true
                      }
                  }
                  return true
              }
          }
